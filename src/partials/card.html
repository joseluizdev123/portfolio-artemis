<article class="pf-card" data-categorias="{{categorias}}">
<div class="pf-shot" role="img" aria-label="{{alt}}">
<div class="pf-shot__bar" aria-hidden="true"><span class="pf-shot__dot"></span><span class="pf-shot__dot"></span><span class="pf-shot__dot"></span><span class="pf-shot__url">{{dominio}}</span></div>
{{midia}}
</div>
<div class="pf-card__info">
<p class="pf-meta"><span class="pf-meta__lead">{{n}}</span><span aria-hidden="true">·</span><span>{{dominio}}</span></p>
<h3 class="pf-card__name">{{nome}}</h3>
</div>
<a class="pf-card__go"{{href}}{{alvo}}>{{cta}}
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 11L11 5M6 5h5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</article>
