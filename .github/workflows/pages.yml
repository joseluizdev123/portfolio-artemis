# Publica no GitHub Pages a cada push na main.
# Raiz: layout-antigo/ — o layout escolhido pelo Studio (2026-10-20), gerado no site_artemis por
# tools/build_portfolio_standalone.py (não editar aqui). /layout-novo/: a prévia anterior, montada por tools/build.py
# a partir de src/ (só index.html + assets/; src/, tools/ e design/ ficam fora do site publicado).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - run: |
          mkdir -p _site/layout-novo
          cp -r layout-antigo/. _site/
          cp index.html _site/layout-novo/
          cp -r assets _site/layout-novo/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
